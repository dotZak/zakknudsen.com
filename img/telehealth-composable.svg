<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Composable telehealth platform, container view</title>
  <desc id="d">Patients and clinicians use a Next.js front end that calls SaaS vendors. Patient data stays inside the Semble boundary.</desc>
  <style>
    svg { --bg:#f5f6f8; --box:#ffffff; --line:#4a5360; --text:#1b1f24; --muted:#4a5360; --accent:#0b5cad; --hl:#e6f0fa; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1a1f26; --box:#111418; --line:#a9b2bf; --text:#e8ebef; --muted:#a9b2bf; --accent:#7ab7ff; --hl:#16263a; }
    }
    .bg { fill:var(--bg); }
    .box { fill:var(--box); stroke:var(--line); stroke-width:1.5; }
    .hl { fill:var(--hl); stroke:var(--accent); stroke-width:2; }
    .dash { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:6 4; }
    .frame { fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:2 4; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .ldash { stroke:var(--accent); stroke-width:1.5; fill:none; stroke-dasharray:6 4; }
    text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; fill:var(--text); }
    .h { font-weight:700; font-size:16px; }
    .m { fill:var(--muted); font-size:13px; }
    .c { text-anchor:middle; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="box" x="20" y="30" width="150" height="60" rx="6"/>
  <text class="c h" x="95.0" y="56.0">Patient</text>
  <text class="c m" x="95.0" y="74.0">and clinician</text>
  <rect class="hl" x="230" y="20" width="330" height="80" rx="6"/>
  <text class="c h" x="395.0" y="47.0">Next.js front end (TypeScript)</text>
  <text class="c m" x="395.0" y="65.0">on S3 + CloudFront</text>
  <text class="c m" x="395.0" y="83.0">DNS in Route 53, provisioned with Terraform</text>
  <path class="ln" d="M170 60 L230 60" marker-end="url(#ar)"/>
  <rect class="frame" x="710" y="175" width="220" height="165" rx="8"/>
  <text class="h" x="722" y="328">Patient data stays here</text>
  <path class="ln" d="M395 100 L395 140"/>
  <path class="ln" d="M90 140 L820 140"/>
  <path class="ln" d="M90.0 140 L90.0 190" marker-end="url(#ar)"/>
  <rect class="box" x="20" y="190" width="140" height="80" rx="6"/>
  <text class="c h" x="90.0" y="226.0">Auth0</text>
  <text class="c m" x="90.0" y="244.0">identity</text>
  <path class="ln" d="M245.0 140 L245.0 190" marker-end="url(#ar)"/>
  <rect class="box" x="175" y="190" width="140" height="80" rx="6"/>
  <text class="c h" x="245.0" y="226.0">Stripe</text>
  <text class="c m" x="245.0" y="244.0">payments</text>
  <path class="ln" d="M400.0 140 L400.0 190" marker-end="url(#ar)"/>
  <rect class="box" x="330" y="190" width="140" height="80" rx="6"/>
  <text class="c h" x="400.0" y="226.0">Sanity</text>
  <text class="c m" x="400.0" y="244.0">content</text>
  <path class="ln" d="M595.0 140 L595.0 190" marker-end="url(#ar)"/>
  <rect class="box" x="485" y="190" width="220" height="80" rx="6"/>
  <text class="c h" x="595.0" y="217.0">Directus</text>
  <text class="c m" x="595.0" y="235.0">PostgreSQL, row-level security</text>
  <text class="c m" x="595.0" y="253.0">platform data, no patient data</text>
  <path class="ln" d="M820.0 140 L820.0 205" marker-end="url(#ar)"/>
  <rect class="hl" x="720" y="205" width="200" height="95" rx="6"/>
  <text class="c h" x="820.0" y="230.5">Semble</text>
  <text class="c m" x="820.0" y="248.5">video consultations</text>
  <text class="c m" x="820.0" y="266.5">clinical workflow</text>
  <text class="c m" x="820.0" y="284.5">all patient data</text>
  <rect class="dash" x="330" y="420" width="300" height="80" rx="6"/>
  <text class="c h" x="480.0" y="447.0">Pipedream</text>
  <text class="c m" x="480.0" y="465.0">webhooks between Stripe,</text>
  <text class="c m" x="480.0" y="483.0">Semble, Truepill, and Directus</text>
  <rect class="box" x="20" y="425" width="220" height="70" rx="6"/>
  <text class="c h" x="130.0" y="456.0">Truepill</text>
  <text class="c m" x="130.0" y="474.0">pharmacy fulfilment</text>
  <path class="ldash" d="M330 460 L240 460" marker-end="url(#ara)"/>
  <path class="ldash" d="M480 420 L480 360"/>
  <path class="ldash" d="M245 360 L895 360"/>
  <path class="ldash" d="M245 360 L245 270" marker-end="url(#ara)"/>
  <path class="ldash" d="M595 360 L595 270" marker-end="url(#ara)"/>
  <path class="ldash" d="M895 360 L895 300" marker-end="url(#ara)"/>
</svg>
