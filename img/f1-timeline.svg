<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Formula 1 ticketing platform timeline, March to September 2026</title>
  <desc id="d">Six points on a horizontal timeline. See the text alternative on the page.</desc>
  <style>
    svg { --bg:#f5f6f8; --box:#ffffff; --line:#4a5360; --text:#1b1f24; --muted:#4a5360; --accent:#0b5cad; --hl:#e6f0fa; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1a1f26; --box:#111418; --line:#a9b2bf; --text:#e8ebef; --muted:#a9b2bf; --accent:#7ab7ff; --hl:#16263a; }
    }
    .bg { fill:var(--bg); }
    .box { fill:var(--box); stroke:var(--line); stroke-width:1.5; }
    .hl { fill:var(--hl); stroke:var(--accent); stroke-width:2; }
    .dash { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:6 4; }
    .frame { fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:2 4; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .ldash { stroke:var(--accent); stroke-width:1.5; fill:none; stroke-dasharray:6 4; }
    text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; fill:var(--text); }
    .h { font-weight:700; font-size:16px; }
    .m { fill:var(--muted); font-size:13px; }
    .c { text-anchor:middle; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="960" height="440"/>
  <line class="ln" x1="30" y1="220" x2="930" y2="220"/>
  <circle cx="90" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M90 212 L90 170"/>
  <text class="h" x="90" y="105" text-anchor="middle">1. March 2026</text>
  <text class="m" x="90" y="127" text-anchor="middle">AWS Bahrain region</text>
  <text class="m" x="90" y="145" text-anchor="middle">(me-south-1) disrupted</text>
  <circle cx="240" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M240 228 L240 270"/>
  <text class="h" x="240" y="295" text-anchor="middle">2. March to April 2026</text>
  <text class="m" x="240" y="317" text-anchor="middle">Whole AWS estate moved</text>
  <text class="m" x="240" y="335" text-anchor="middle">to Ireland (eu-west-1)</text>
  <circle cx="390" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M390 212 L390 170"/>
  <text class="h" x="390" y="105" text-anchor="middle">3. 6 August 2026</text>
  <text class="m" x="390" y="127" text-anchor="middle">On-sale launch day</text>
  <text class="m" x="390" y="145" text-anchor="middle">on the old stack</text>
  <circle cx="540" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M540 228 L540 270"/>
  <text class="h" x="540" y="295" text-anchor="middle">4. 7 August 2026</text>
  <text class="m" x="540" y="317" text-anchor="middle">Plugin outage proves the</text>
  <text class="m" x="540" y="335" text-anchor="middle">PHP 7.4 stack cannot be</text>
  <text class="m" x="540" y="353" text-anchor="middle">maintained. New stack</text>
  <text class="m" x="540" y="371" text-anchor="middle">decided and scaffolded.</text>
  <circle cx="690" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M690 212 L690 170"/>
  <text class="h" x="690" y="51" text-anchor="middle">5. August 2026</text>
  <text class="m" x="690" y="73" text-anchor="middle">Main site cut over to the</text>
  <text class="m" x="690" y="91" text-anchor="middle">Fargate stack. 28 Aug:</text>
  <text class="m" x="690" y="109" text-anchor="middle">session-cookie fix live.</text>
  <text class="m" x="690" y="127" text-anchor="middle">Load balancer locked</text>
  <text class="m" x="690" y="145" text-anchor="middle">to CloudFront.</text>
  <circle cx="850" cy="220" r="8" fill="var(--accent)"/>
  <path class="ln" d="M850 228 L850 270"/>
  <text class="h" x="850" y="295" text-anchor="middle">6. 30 September 2026</text>
  <text class="m" x="850" y="317" text-anchor="middle">Next season's on-sale on</text>
  <text class="m" x="850" y="335" text-anchor="middle">the new stack, with a live</text>
  <text class="m" x="850" y="353" text-anchor="middle">Queue-it waiting room.</text>
</svg>
